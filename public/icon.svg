<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="planet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect width="512" height="512" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Ring Shadow / Glow -->
  <ellipse cx="256" cy="256" rx="200" ry="60" fill="none" stroke="url(#ring)" stroke-width="16" transform="rotate(-28 256 256)" filter="url(#glow)" opacity="0.8" />

  <!-- Central Planet (Jupiter) -->
  <circle cx="256" cy="256" r="120" fill="url(#planet)" />

  <!-- Atmospheric Stripes on Jupiter -->
  <path d="M 145 230 Q 256 260 367 230" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.3" />
  <path d="M 140 260 Q 256 295 372 260" fill="none" stroke="#020617" stroke-width="10" stroke-opacity="0.25" />
  <path d="M 152 285 Q 256 320 360 285" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.35" />

  <!-- Great Red/Cyan Spot -->
  <circle cx="305" cy="290" r="18" fill="#f43f5e" fill-opacity="0.8" />
  <circle cx="305" cy="290" r="14" fill="#fb7185" />

  <!-- Front Half of Orbital Ring -->
  <path d="M 76 325 A 200 60 0 0 0 436 187" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round" transform="rotate(-28 256 256)" />

  <!-- Central Dex Bolt / Swap Arrow Badge -->
  <g transform="translate(256, 256)">
    <!-- Cyan glow point -->
    <circle cx="0" cy="0" r="32" fill="#020617" fill-opacity="0.8" stroke="#38bdf8" stroke-width="4" />
    <path d="M -8 -16 L 10 -4 L 0 0 L 8 16 L -10 4 L 0 0 Z" fill="#38bdf8" />
  </g>
</svg>
